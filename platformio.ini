[platformio]
default_envs = m5stick-c-se

[env:m5stick-c-se]
; Factory uses m5stick-c, with LCD detected as StickCPlus by M5GFX.
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags = -DCORE_DEBUG_LEVEL=0 -std=gnu++17
lib_ldf_mode = deep+
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
; M5Unified 0.2.23 / M5GFX 0.2.30 are vendored in lib/.

[env:development]
extends = env:m5stick-c-se
build_flags = ${env:m5stick-c-se.build_flags} -DMINIGAMES_SEED=12345 -DMINIGAMES_BURST_STAGE=16
